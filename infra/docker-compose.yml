# AI Squad — Phase P4
# Stack: postgres, redis, control-api, admin-web, workers, github-svc.

services:
  postgres:
    image: postgres:16-alpine
    container_name: squad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local}
      POSTGRES_DB: ${POSTGRES_DB:-squad}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-squad} -d ${POSTGRES_DB:-squad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: squad-redis
    restart: unless-stopped
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-api:
    build:
      context: ../control-api
      dockerfile: Dockerfile
    container_name: squad-control-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: AI Squad Control API
      APP_VERSION: 0.2.0-foundation
      APP_ENV: development
      APP_PHASE: P4
      HEALTH_TIMEOUT_SECONDS: 2.0
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-squad_app}:${APP_DB_PASSWORD:-squadapp-local}@postgres:5432/${POSTGRES_DB:-squad}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-squad}:${POSTGRES_PASSWORD:-changeme-local}@postgres:5432/${POSTGRES_DB:-squad}
      REDIS_URL: redis://redis:6379/0
      SANDBOX_DISPATCHER_URL: http://sandbox-dispatcher:8090
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://control-api:8000}
        NEXT_PUBLIC_APP_PHASE: P4
    container_name: squad-admin-web
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://control-api:8000}
      NEXT_PUBLIC_APP_PHASE: P4
      NODE_ENV: production
    ports:
      - "3000:3000"

  workers:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: squad-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_DATABASE_URL: postgresql://${APP_DB_USER:-squad_app}:${APP_DB_PASSWORD:-squadapp-local}@postgres:5432/${POSTGRES_DB:-squad}
      PM_LLM_PROVIDER: ${PM_LLM_PROVIDER:-llama_cpp}
      PM_BASE_URL: ${PM_BASE_URL:-http://host.docker.internal:8080/v1}
      PM_API_KEY: ${PM_API_KEY:-}
      PM_REQUEST_TIMEOUT_SECONDS: ${PM_REQUEST_TIMEOUT_SECONDS:-600}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      PM_MODEL: ${PM_MODEL:-qwen3.5-35b-a3b-q4}
      # dev-jr: Ollama + smaller code-focused model
      DEV_JR_PROVIDER: ${DEV_JR_PROVIDER:-ollama}
      DEV_JR_BASE_URL: ${DEV_JR_BASE_URL:-}
      DEV_JR_MODEL: ${DEV_JR_MODEL:-qwen2.5-coder:7b}
      DEV_JR_API_KEY: ${DEV_JR_API_KEY:-}
      # dev-sr: same llama-server as PM (35B for judgment)
      DEV_SR_PROVIDER: ${DEV_SR_PROVIDER:-}
      DEV_SR_BASE_URL: ${DEV_SR_BASE_URL:-}
      DEV_SR_MODEL: ${DEV_SR_MODEL:-}
      DEV_SR_API_KEY: ${DEV_SR_API_KEY:-}
      GITHUB_SVC_URL: http://github-svc:9000
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_DISPATCHER_URL: http://sandbox-dispatcher:8090

  sandbox-dispatcher:
    build:
      context: ../sandbox-dispatcher
      dockerfile: Dockerfile
    container_name: squad-sandbox-dispatcher
    restart: unless-stopped
    environment:
      SANDBOX_IO_PATH: /sandbox-io
      SANDBOX_DISPATCH_TIMEOUT: "120"
    volumes:
      - sandbox_io:/sandbox-io
    ports:
      - "8090:8090"

  sandbox-runner:
    build:
      context: ../sandbox-runner
      dockerfile: Dockerfile
    container_name: squad-sandbox-runner
    restart: unless-stopped
    network_mode: none
    environment:
      SANDBOX_IO_PATH: /sandbox-io
      SANDBOX_POLL_INTERVAL: "0.5"
    volumes:
      - sandbox_io:/sandbox-io

  github-svc:
    build:
      context: ../github-svc
      dockerfile: Dockerfile
    container_name: squad-github-svc
    restart: unless-stopped
    environment:
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      GITHUB_REPO_ORG: ${GITHUB_REPO_ORG:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-ai-squad-test-workspace}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "9000:9000"

volumes:
  postgres_data:
    name: squad-postgres-data
  redis_data:
    name: squad-redis-data
  sandbox_io:
    name: squad-sandbox-io
